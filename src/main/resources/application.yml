server:
  port: 8080

spring:
  application:
    name: corebank

  datasource:
    url: jdbc:postgresql://localhost:5432/corebank_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

